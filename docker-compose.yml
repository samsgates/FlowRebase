services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowrebase
      POSTGRES_PASSWORD: flowrebase
      POSTGRES_DB: flowrebase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowrebase"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:-change-me-before-production}
      DATABASE_URL: postgresql+asyncpg://flowrebase:flowrebase@db:5432/flowrebase
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPA_URL: ${OPA_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  temporal-db:
    profiles: ["orchestration"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporaldata:/var/lib/postgresql/data

  temporal:
    profiles: ["orchestration"]
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"
    depends_on:
      - temporal-db

volumes:
  pgdata:
  redisdata:
  temporaldata:
