apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowrebase-api
  namespace: flowrebase
spec:
  replicas: 2
  selector:
    matchLabels: { app: flowrebase-api }
  template:
    metadata:
      labels: { app: flowrebase-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/flowrebase-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: flowrebase-api-env }
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: flowrebase-api
  namespace: flowrebase
spec:
  selector: { app: flowrebase-api }
  ports: [{ port: 80, targetPort: 8000 }]
